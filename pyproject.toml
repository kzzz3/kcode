[project]
name = "kcode"
version = "0.1.0"
description = "KCode: production-grade CLI coding agent."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = [
  "pydantic>=2.7,<3",
  "eval-type-backport>=0.2,<1",
  "pydantic-settings>=2.2,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
kcode = "apps.cli.src.kcode_cli:app"

[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/cli/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["packages/core", "apps/cli"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
